services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pms_integration_test
      POSTGRES_USER: pms_test
      POSTGRES_PASSWORD: pms_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms_test -d pms_integration_test']
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
